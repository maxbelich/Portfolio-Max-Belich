@if (open()) {
  <div class="header-overlay" (click)="closed.emit()">
    <div class="header-overlay__content" (click)="$event.stopPropagation()">
      <nav class="header-overlay__nav">
        <a
          routerLink="/"
          fragment="about-me"
          class="header-overlay__link"
          (click)="closed.emit()"
          >{{ 'nav.aboutMe' | translate }}</a
        >
        <a
          routerLink="/"
          fragment="skill-set"
          class="header-overlay__link"
          (click)="closed.emit()"
          >{{ 'nav.skills' | translate }}</a
        >
        <a href="#featured-projects" class="header-overlay__link" (click)="closed.emit()"
          >{{ 'nav.projects' | translate }}</a
        >
      </nav>

      <label class="header-overlay__lang-toggle">
        <input
          type="checkbox"
          class="header-overlay__lang-input"
          [checked]="isGerman()"
          (change)="toggleLanguage()"
        />
        <span class="header-overlay__lang-option header-overlay__lang-option--en">EN</span>
        <span class="header-overlay__lang-option header-overlay__lang-option--de">DE</span>
        <span class="header-overlay__lang-knob"></span>
      </label>
    </div>
  </div>
}
