<div class="testimonial-card" [class.testimonial-card--dimmed]="dimmed()">
  <p class="testimonial-card__text">{{ testimonial().textKey | translate }}</p>

  <div class="testimonial-card__author">
    <span class="testimonial-card__line" aria-hidden="true"></span>
    <span class="testimonial-card__name"
      >{{ testimonial().name }} - {{ testimonial().roleKey | translate }}</span
    >
  </div>
</div>
