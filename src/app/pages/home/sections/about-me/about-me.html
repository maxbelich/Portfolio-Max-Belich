<section class="about-me" id="about-me">
  <div class="about-me__inner">
    <img src="/images/Photo.png" alt="Max Belich" class="about-me__image" />

    <app-card [eyebrow]="'aboutMe.eyebrow' | translate">
      <h2 class="about-me__title">{{ 'aboutMe.title' | translate }}</h2>

      <p class="about-me__intro">
        {{ 'aboutMe.intro' | translate }}
      </p>

      <ul class="about-me__list">
        <li class="about-me__item">
          <img src="/icons/ui/location-on.svg" alt="" class="about-me__icon" />
          <p class="about-me__text">
            {{ 'aboutMe.location' | translate }}
          </p>
        </li>
        <li class="about-me__item">
          <img src="/icons/ui/cognition.svg" alt="" class="about-me__icon" />
          <p class="about-me__text">
            {{ 'aboutMe.learning' | translate }}
          </p>
        </li>
        <li class="about-me__item">
          <img src="/icons/ui/new-releases.svg" alt="" class="about-me__icon" />
          <p class="about-me__text">
            {{ 'aboutMe.problemSolving' | translate }}
          </p>
        </li>
      </ul>
    </app-card>
  </div>
</section>
